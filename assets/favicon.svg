<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <circle cx="32" cy="32" r="24" stroke="url(#grad)" stroke-width="2" fill="none" opacity="0.3" />
  <!-- Greek Phi -->
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="14" stroke="url(#grad)" stroke-width="4.5" fill="none" />
    <line x1="32" y1="8" x2="32" y2="56" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
